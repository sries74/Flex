name: ci
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ci.yml']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:rn
      - name: expo-doctor
        run: npx --yes expo-doctor
      - name: Android bundle smoke test
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
