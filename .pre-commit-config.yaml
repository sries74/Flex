repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: mobile-lint-staged
        name: mobile lint-staged (eslint + prettier)
        entry: bash -c 'cd mobile && [ -d node_modules ] && npm run -s precommit || echo "skip: run npm ci in mobile/"'
        language: system
        files: ^mobile/
        pass_filenames: false
